<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Sistema de Estoque</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        main {
            background: white;
            padding: 32px;
            border-radius: 12px;
            width: 360px;
            box-shadow: 0 4px 18px #0002;
        }

        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccd3dd;
            border-radius: 6px;
        }

        button {
            background: #174ea6;
            color: white;
            border: none;
            cursor: pointer;
        }

        .erro {
            color: #b42318;
        }

        .sucesso {
            color: #067647;
        }
    </style>

</head>

<body>

    <main>

        <h2>Sistema de Estoque</h2>

        {% with mensagens = get_flashed_messages(with_categories=true) %}

            {% for tipo, mensagem in mensagens %}

                <p class="{{ tipo }}">
                    {{ mensagem }}
                </p>

            {% endfor %}

        {% endwith %}

        <form method="POST">

            <label>Usuário</label>

            <input
                type="text"
                name="usuario"
                placeholder="Digite seu usuário"
                required
            >

            <label>Senha</label>

            <input
                type="password"
                name="senha"
                placeholder="Digite sua senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

        <p>
            <small>
                Primeiro acesso:<br>
                Usuário: admin<br>
                Senha: admin123
            </small>
        </p>

    </main>

</body>

</html>
